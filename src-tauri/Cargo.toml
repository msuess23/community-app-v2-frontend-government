[package]
name = "community-authority-client"
version = "0.1.0"
description = "Native wrapper for the Community App authority client"
edition = "2021"

[lib]
name = "community_authority_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
